/particle_filter:
  ros__parameters:
    angle_step: 18
    fine_timing: 0
    max_particles: 4000
    max_range: 10
    max_viz_particles: 60
    motion_dispersion_theta: 0.25
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    odometry_topic: /odom/imu
    publish_odom: 1
    range_method: rmgpu
    rangelib_variant: 2
    scan_topic: /scan
    sigma_hit: 8.0
    squash_factor: 2.2
    start_type_description_service: true
    theta_discretization: 112
    use_sim_time: false
    viz: 1
    z_hit: 0.75
    z_max: 0.07
    z_rand: 0.12
    z_short: 0.01
