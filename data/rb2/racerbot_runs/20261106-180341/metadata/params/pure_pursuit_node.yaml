    live_tunable_spec: '{"version":1,"node":"pure_pursuit_node","params":[{"name":"max_speed","group":"Speed","label":"max
      speed","kind":"float","min":0.3,"max":6.0,"step":0.1,"unit":"m/s","safety":false,"description":"Ceiling
      on commanded speed. The recorded speed profile is clipped to this, so lowering
      it slows the whole lap without re-recording a line."},{"name":"min_speed","group":"Speed","label":"min
      speed","kind":"float","min":0.0,"max":3.0,"step":0.1,"unit":"m/s","safety":false,"description":"Floor
      the profiled speed is held to, so the car keeps creeping through the slowest
      corner instead of stalling in it."},{"name":"max_acceleration","group":"Speed","label":"max
      acceleration","kind":"float","min":1.0,"max":8.0,"step":0.25,"unit":"m/s^2","safety":false,"description":"How
      fast a speed *command* may rise (not a demand on the motor). Bounded on both
      sides: too low and the car cannot rebuild speed behind a slower car, too high
      and it arrives too hot to commit to a pass. 5-6 is the validated band -- see
      docs/simulator.md before leaving it."},{"name":"max_braking_decel","group":"Speed","label":"max
      braking decel","kind":"float","min":1.0,"max":12.0,"step":0.25,"unit":"m/s^2","safety":false,"description":"Shapes
      how fast a normal speed command may fall. An emergency stop ignores this and
      is immediate."},{"name":"max_lateral_accel","group":"Speed","label":"max lateral
      accel","kind":"float","min":0.5,"max":6.0,"step":0.1,"unit":"m/s^2","safety":false,"description":"Cornering
      aggression: the online cap holds speed to sqrt(a_lat / curvature). The single
      best knob for \"it understeers wide\" vs \"it scrubs and slows\"."},{"name":"min_lookahead","group":"Line
      following","label":"min lookahead","kind":"float","min":0.2,"max":3.0,"step":0.05,"unit":"m","safety":false,"description":"Lookahead
      distance at a standstill. Smaller corners harder and wobbles sooner; larger
      cuts corners and settles."},{"name":"max_lookahead","group":"Line following","label":"max
      lookahead","kind":"float","min":0.5,"max":5.0,"step":0.05,"unit":"m","safety":false,"description":"Lookahead
      ceiling at speed. Must stay at or below overtake_lookahead_distance."},{"name":"lookahead_speed_gain","group":"Line
      following","label":"lookahead speed gain","kind":"float","min":0.0,"max":0.6,"step":0.01,"unit":"m
      per m/s","safety":false,"description":"How much the lookahead stretches with
      measured speed: L = gain*v + min_lookahead, clipped to [min, max]."},{"name":"max_steering_rate","group":"Line
      following","label":"max steering rate","kind":"float","min":0.2,"max":4.0,"step":0.1,"unit":"rad/s","safety":false,"description":"Caps
      how fast the steering angle may slew between commands. Lower is calmer and later;
      higher is sharper and can chatter."},{"name":"enable_obstacle_avoidance","group":"Avoidance","label":"enable
      obstacle avoidance","kind":"bool","min":0.0,"max":1.0,"step":0.0,"unit":"","safety":false,"description":"Steer
      around something in the forward cone when there is room, instead of only hard-stopping
      for it. The hard stop still wins when it is too close."},{"name":"avoidance_trigger_distance","group":"Avoidance","label":"avoidance
      trigger distance","kind":"float","min":0.3,"max":4.0,"step":0.05,"unit":"m","safety":false,"description":"How
      far ahead a map-absent object starts a steer-around. Applies only once a map
      is available to subtract the walls."},{"name":"avoidance_min_gap_distance","group":"Avoidance","label":"avoidance
      min gap distance","kind":"float","min":0.3,"max":3.0,"step":0.05,"unit":"m","safety":false,"description":"How
      deep an opening must be before it counts as somewhere to steer into."},{"name":"avoidance_speed","group":"Avoidance","label":"avoidance
      speed","kind":"float","min":0.2,"max":3.0,"step":0.05,"unit":"m/s","safety":false,"description":"Speed
      held while actively steering around something."},{"name":"enable_opponent_overtake","group":"Overtaking","label":"enable
      opponent overtake","kind":"bool","min":0.0,"max":1.0,"step":0.0,"unit":"","safety":false,"description":"Track
      a detected opponent and attempt a pass. Turning this off leaves the car following
      the racing line and braking for traffic."},{"name":"overtake_trigger_gap","group":"Overtaking","label":"overtake
      trigger gap","kind":"float","min":0.5,"max":10.0,"step":0.1,"unit":"m","safety":false,"description":"Track
      distance to the opponent at which a pass starts being considered."},{"name":"overtake_closing_margin","group":"Overtaking","label":"overtake
      closing margin","kind":"float","min":0.0,"max":2.0,"step":0.05,"unit":"m/s","safety":false,"description":"Minimum
      closing rate before a pass is worth attempting. Raise it if the car keeps committing
      to passes it cannot finish."},{"name":"overtake_lateral_offset","group":"Overtaking","label":"overtake
      lateral offset","kind":"float","min":0.0,"max":1.0,"step":0.05,"unit":"m","safety":false,"description":"Sideways
      nudge applied to the steering target while passing -- how wide the pass runs."},{"name":"overtake_clear_margin","group":"Overtaking","label":"overtake
      clear margin","kind":"float","min":0.0,"max":5.0,"step":0.1,"unit":"m","safety":false,"description":"Track
      distance to get past the opponent before rejoining the racing line."},{"name":"overtake_min_side_clearance","group":"Overtaking","label":"overtake
      min side clearance","kind":"float","min":0.0,"max":2.0,"step":0.05,"unit":"m","safety":false,"description":"Room
      the passing side must have before the car will commit. Higher = choosier about
      passing places."},{"name":"emergency_stop_distance","group":"Safety margins","label":"emergency
      stop distance","kind":"float","min":0.15,"max":2.0,"step":0.05,"unit":"m","safety":true,"description":"Range
      inside the forward cone that triggers an immediate stop. Lowering it lets the
      car run closer to traffic and leaves less room to be wrong."},{"name":"emergency_stop_clearance","group":"Safety
      margins","label":"emergency stop clearance","kind":"float","min":0.0,"max":0.4,"step":0.01,"unit":"m","safety":true,"description":"All-round
      contact floor measured from the car body rather than the sensor -- this is the
      one that sees a wall the car is alongside."},{"name":"safety_fov_deg","group":"Safety
      margins","label":"safety fov deg","kind":"float","min":20.0,"max":180.0,"step":5.0,"unit":"deg","safety":true,"description":"Width
      of the forward cone the hard-stop net watches. Narrower ignores more of what
      is beside the car."},{"name":"max_cross_track_error","group":"Safety margins","label":"max
      cross track error","kind":"float","min":0.3,"max":5.0,"step":0.1,"unit":"m","safety":true,"description":"Stop
      if the car is further than this from every waypoint -- the lost/kidnapped watchdog.
      Raising it buys tolerance for a rough line and costs detection of a genuinely
      lost car."}]}'
