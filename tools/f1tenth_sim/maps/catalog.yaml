# Simulator tracks imported from occupancy maps by track_import.py.
# One entry per track; files live beside this one. Regenerate an
# entry by re-running the import command recorded in it.
car1_course_2026_10_26:
  import_command: 'python3 tools/f1tenth_sim/track_import.py /home/racerbotcar-1/.ros/racerbot_auto/20261026-194514-clean/map.yaml
    --name car1_course_2026_10_26 --source ''car 1 course: cleaned SLAM map of run
    20261026-194514 (map_course gyro_odom, 2026-10-26 19:45); see ~/.ros/racerbot_auto/20261026-194514-clean/SOURCE.txt'''
  lap_length_m: 31.12
  source: 'car 1 course: cleaned SLAM map of run 20261026-194514 (map_course gyro_odom,
    2026-10-26 19:45); see ~/.ros/racerbot_auto/20261026-194514-clean/SOURCE.txt'
  width_median_m: 1.52
  width_min_m: 1.06
  width_p10_m: 1.3
