pure_pursuit_node:
  ros__parameters:
    # Car 2's measured steering chain (3-tick command transport, 2-tick pose
    # delay, servo 15/s at 2.5 rad/s; simulator floor sfu_course_2026_11_06,
    # fitted to its 2026-11-06 runs) makes pure pursuit weave at speed: 0.45 m
    # cross-track and wall contact on 06a. delay_lqr predicts through those
    # delays (its delay_lqr.* defaults are car 2's values) and held 0.09 m mean
    # cross-track, no contact, on 06a/06b, 9 seeds each (2026-11-07). Car 1's
    # steering chain is not measured, so it keeps pure_pursuit.
    # why: car 2's measured steering delays make pure pursuit weave at race speed; delay_lqr predicts through them
    steering_law: delay_lqr
    # why: car 2's offset-point pass hit cars/walls in all 48 traffic races; no swept-path planner exists
    enable_opponent_overtake: false
    # why: car 2's measured 4/3 m/s² speed loop and transport/lag require braking before the emergency tier
    enable_opponent_following: true
    # Car 2's fitted speed loop waits ~0.1 s then closes at 7/s, so it trails a
    # rising profile by ~0.4-0.6 m/s out of every corner (2026-11-09 traces).
    # why: car 2's measured speed-loop lag; leading acceleration by 0.25 s cut 06a 11.42 -> 11.31 s with no contact
    speed_lead_time: 0.25
    # Launch-lap speed scale (launch_scale.py): after LB is pressed from standstill the profiled speed is
    # multiplied by this for one lap (launch_scale_distance 0 = one line length), then back to 1. The real
    # first lap from a standing start (rb2, 2026-11-11, 20261111-152132) carried 4.94 m/s at s=12 m and ran
    # wide at s=12-15 m into the wall, where its flying laps carry 4.40 m/s there.
    # why: rb2's first lap from a standing start ran wide into the wall at s=12-15 m (run 20261111-152132): 4.94 m/s where its flying laps carry 4.40; 0.88 of the planned peak there (4.88) is 4.29
    launch_speed_scale: 0.88
